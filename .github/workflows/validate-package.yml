name: Validate Packaging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'packaging/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            devscripts \
            distro-info \
            distro-info-data \
            dput \
            git \
            jq \
            lintian \
            python3 \
            xdg-utils \
            xz-utils \
            desktop-file-utils
          rm -rf /var/lib/apt/lists/*

          command -v bash
          command -v curl
          command -v debuild
          command -v dpkg-buildpackage
          command -v dpkg-deb
          command -v dpkg-source
          command -v git
          command -v jq
          command -v lintian
          command -v ubuntu-distro-info

      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh

      - name: Build source package
        run: |
          ./scripts/build-source-package.sh --series "questing"

      - name: Lint generated source package
        run: |
          lintian --fail-on error dist/*.dsc dist/*_source.changes

      - name: Validate generated source and binary payloads
        run: |
          ./scripts/validate-generated-packages.sh dist
