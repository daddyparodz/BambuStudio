name: Sync Launchpad PPA

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional upstream tag to package
        required: false
        type: string
      channel:
        description: Release channel to package
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      ppa_revision:
        description: PPA revision suffix
        required: false
        default: '1'
        type: string
      upload:
        description: Upload to Launchpad
        required: false
        default: true
        type: boolean
      series:
        description: Optional space-separated Ubuntu series override
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: sync (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(github.event_name == 'schedule' && '["stable","beta"]' || format('["{0}"]', inputs.channel)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl jq devscripts debhelper dput gnupg xz-utils desktop-file-utils xdg-utils distro-info-data

      - name: Determine upstream tag
        id: upstream
        run: |
          channel="${{ matrix.channel }}"
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="$(./scripts/get-latest-release-tag.sh "$channel")"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve workflow settings
        id: settings
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload="${{ inputs.upload }}"
            revision="${{ inputs.ppa_revision }}"
          else
            upload="true"
            revision="1"
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check whether upload is needed
        id: state
        run: |
          marker_file="state/latest-${{ steps.upstream.outputs.channel }}-tag.txt"
          recorded="$(tr -d '\n' < "$marker_file" || true)"
          force=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            force=true
          fi
          if [[ "$recorded" == "${{ steps.upstream.outputs.tag }}" && "$force" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Launchpad signing key
        if: steps.state.outputs.skip != 'true' && steps.settings.outputs.upload == 'true'
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_FINGERPRINT: ${{ secrets.LAUNCHPAD_GPG_FINGERPRINT }}
        run: |
          test -n "$LAUNCHPAD_GPG_PRIVATE_KEY"
          test -n "$LAUNCHPAD_GPG_FINGERPRINT"
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "LAUNCHPAD_GPG_FINGERPRINT=$LAUNCHPAD_GPG_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build source packages
        if: steps.state.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          PPA_REVISION: ${{ steps.settings.outputs.revision }}
          SOURCE_INCLUDE_MODE: auto
          SERIES_OVERRIDE: ${{ inputs.series }}
          CHANNEL: ${{ steps.upstream.outputs.channel }}
          DEBFULLNAME: daddyparodz
          DEBEMAIL: 45983094+daddyparodz@users.noreply.github.com
        run: |
          if [[ -n "${SERIES_OVERRIDE:-}" ]]; then
            series="$SERIES_OVERRIDE"
          else
            series="$(./scripts/list-ubuntu-series.sh)"
          fi
          echo "Using Ubuntu series: ${series}"
          args=(--release-tag "$RELEASE_TAG" --series "$series")
          if [[ "${{ steps.settings.outputs.upload }}" == "true" ]]; then
            export DEBSIGN_KEYID="${LAUNCHPAD_GPG_FINGERPRINT}"
            args+=(--sign)
          fi
          ./scripts/build-source-package.sh --channel "$CHANNEL" "${args[@]}"

      - name: Validate generated source and binary payloads
        if: steps.state.outputs.skip != 'true'
        env:
          PPA_REVISION: ${{ steps.settings.outputs.revision }}
          SOURCE_INCLUDE_MODE: auto
        run: |
          ./scripts/validate-generated-packages.sh dist

      - name: Upload to Launchpad
        if: steps.state.outputs.skip != 'true' && steps.settings.outputs.upload == 'true'
        env:
          PPA_REVISION: ${{ steps.settings.outputs.revision }}
        run: |
          echo "Starting Launchpad source upload..."
          ./scripts/upload-ppa.sh dist/*_source.changes
          echo "Launchpad source upload completed."

      - name: Update packaged release marker
        if: steps.state.outputs.skip != 'true' && steps.settings.outputs.upload == 'true' && success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          marker_file="state/latest-${{ steps.upstream.outputs.channel }}-tag.txt"
          printf '%s\n' "${{ steps.upstream.outputs.tag }}" > "$marker_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker_file"
          git commit -m "chore: record ${{ steps.upstream.outputs.channel }} packaged release ${{ steps.upstream.outputs.tag }}" || exit 0
          git push

      - name: Cleanup old workflow artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Removing stale Actions artifacts to avoid storage accumulation..."
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.name=="launchpad-source-package" or .name=="source-package") | .id' \
          | while read -r artifact_id; do
              [[ -n "$artifact_id" ]] || continue
              gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/"$artifact_id"
              echo "Deleted artifact id=$artifact_id"
            done
