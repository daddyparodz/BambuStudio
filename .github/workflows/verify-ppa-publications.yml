name: Verify Launchpad PPA Publications

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-ppa-publications.yml'
      - 'scripts/verify-ppa-release.sh'
      - 'scripts/reconcile-ppa-release-state.sh'

permissions:
  contents: write

concurrency:
  group: verify-ppa-publications
  cancel-in-progress: true

jobs:
  verify:
    name: reconcile
    runs-on: [self-hosted, linux, x64]
    container:
      image: ubuntu:24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap container
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            jq \
            python3 \
            python3-launchpadlib
          rm -rf /var/lib/apt/lists/*
          command -v git
          command -v jq
          command -v python3
          python3 -c "from launchpadlib.launchpad import Launchpad"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconcile pending Launchpad releases
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash ./scripts/reconcile-ppa-release-state.sh
